# Trade.2026 — Gửi tín hiệu coin qua RELAY Flask (mỗi 5 phút)
# Đọc bảng signals, với mỗi tín hiệu mới đủ điểm (>=70, alert_ready hoặc
# retest_in_progress, loại "that") thì POST về relay của web bot-tele-2026
# (https://bot-tele-2026.vercel.app/api/signal-relay, header X-Signal-Key).
# Flask định tuyến theo kind="coin": ngưỡng 70, chống trùng 60 phút/coin,
# chat + token bot coin lấy từ bảng bots -> gửi tin giàu (chart Pillow +
# thẻ chi tiết + nút bấm) về Telegram qua @trademrbit_bot.
# Chống gửi trùng bằng danh sách id đã gửi trong station_heartbeat
# (tram = 'telegram-sender'). Không chạm code gốc của dự án.
#
# Secret cần thêm (repo Trade.2026 -> Settings -> Secrets and variables):
#   SIGNAL_KEY — giá trị PHẢI GIỐNG hệt biến SIGNAL_KEY trên Vercel
#   của bot-tele-2026 (xem HUONG_DAN_MULTI_BOT.md).
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID không còn dùng ở đây nữa
# (chat + token do Flask lấy từ bảng bots / Vercel env).
name: Gui tin hieu Telegram (Supabase)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chay thu (khong relay, chi log)"
        type: boolean
        default: false
      test_message:
        description: "Relay 1 tin hieu demo coin (BTC long 78) qua relay"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: station-sender
  cancel-in-progress: false

jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SIGNAL_KEY: ${{ secrets.SIGNAL_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      SEND_TEST: ${{ inputs.test_message && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Relay tin hieu moi qua Flask
        run: node tools/telegram-sender.js
